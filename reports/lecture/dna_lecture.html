<!DOCTYPE html>
<html lang="en" dir="ltr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>DNA: from the double helix to the assembled genome</title>
<style>
/* DNA Studio: one visual language for the 3D viewer, the process animations and the lecture.
   System fonts only (the application runs offline). */
:root {
  --ink: #10243b;
  --ink-soft: #4a5b70;
  --ink-faint: #7c8a9b;
  --paper: #ffffff;
  --panel: #f3f6f9;
  --line: #d9e1ea;
  --accent: #0072b2;
  --accent-soft: #e3f0f8;
  --signal: #d55e00;
  --signal-soft: #fdeee3;
  --good: #009e73;
  --stage: #0b1626;
  --stage-2: #13243b;
  --stage-ink: #e8eef6;
  --stage-soft: #9fb0c5;
  --a: #00b383;
  --t: #e8662a;
  --g: #f2ae1c;
  --c: #2f8fdc;
  --u: #cc79a7;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Cambria, serif;
  --mono: Consolas, "Cascadia Mono", "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background: transparent;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- 3D molecule view --------------------------------------------------------------------- */
.ds-mol { display: flex; flex-direction: column; gap: 8px; height: 100%; min-height: 0; }
.ds-toolbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.ds-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ds-group-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-faint);
}
.ds-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); }
.ds-seg button {
  border: 0; background: transparent; padding: 6px 11px; font-size: 13px; color: var(--ink-soft);
  cursor: pointer; border-right: 1px solid var(--line); transition: background 0.15s, color 0.15s;
}
.ds-seg button:last-child { border-right: 0; }
.ds-seg button:hover { background: var(--panel); }
.ds-seg button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 600; }
.ds-toggle, .ds-icon {
  border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 11px;
  font-size: 13px; color: var(--ink-soft); cursor: pointer; transition: background 0.15s, color 0.15s;
}
.ds-icon { width: 32px; padding: 6px 0; font-weight: 700; }
.ds-toggle:hover, .ds-icon:hover { background: var(--panel); }
.ds-toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.ds-stage {
  position: relative; flex: 1 1 auto; min-height: 260px; border-radius: 14px; overflow: hidden;
  background: var(--stage); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
}
.ds-stage::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 42%, rgba(60, 100, 160, 0.16) 0%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.38) 100%);
}
.ds-badge {
  position: absolute; left: 14px; top: 12px; z-index: 2; font-size: 12px; font-weight: 600;
  color: var(--stage-soft); letter-spacing: 0.02em;
}
.ds-hint {
  position: absolute; left: 0; right: 0; bottom: 10px; z-index: 2; text-align: center;
  font-size: 12px; color: var(--stage-soft); pointer-events: none;
}
.ds-card {
  position: absolute; right: 12px; top: 12px; z-index: 3; width: min(300px, 46%);
  background: rgba(12, 24, 42, 0.9); color: var(--stage-ink); border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 12px; padding: 12px 14px 12px; font-size: 13px; line-height: 1.45;
  backdrop-filter: blur(6px); animation: ds-rise 0.22s ease-out;
}
@keyframes ds-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.ds-card-title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; padding-right: 22px; }
.ds-card-sub { color: var(--stage-soft); margin: 1px 0 8px; }
.ds-card-row { margin: 3px 0; }
.ds-strong { font-weight: 700; color: #fff; margin-top: 8px; }
.ds-card-list { margin: 4px 0 4px 0; padding-left: 16px; font-family: var(--mono); font-size: 12px; }
.ds-card-foot { font-size: 11px; color: var(--stage-soft); margin-top: 4px; }
.ds-card-parts { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
.ds-card-parts .ds-chip { color: var(--stage-ink); }
.ds-card-close {
  position: absolute; right: 8px; top: 6px; border: 0; background: transparent; color: var(--stage-soft);
  font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 6px;
}
.ds-card-close:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
.ds-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 12.5px; color: var(--ink-soft); min-height: 20px; }
.ds-chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ds-swatch { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 2px solid transparent; flex: none; }
.ds-dotted { border-style: dotted; border-radius: 2px; height: 0; width: 16px; border-width: 0 0 3px 0; }
.ds-note { color: var(--ink-faint); font-style: italic; }

/* ---- process animations ------------------------------------------------------------------ */
.ds-proc { display: flex; flex-direction: column; gap: 10px; height: 100%; }
.ds-proc-stage {
  position: relative; border-radius: 14px; overflow: hidden; background: var(--stage);
  flex: 1 1 auto; min-height: 240px;
}
.ds-proc-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ds-proc-caption {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: start;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px;
}
.ds-step-no {
  grid-row: span 2; width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px;
}
.ds-step-title { font-size: 17px; font-weight: 700; color: var(--ink); line-height: 1.25; }
.ds-step-text { font-size: 14.5px; color: var(--ink-soft); line-height: 1.5; }
.ds-step-text b { color: var(--ink); }
.ds-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ds-btn {
  border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 13px;
  font-size: 13.5px; color: var(--ink); cursor: pointer; font-weight: 600; transition: background 0.15s;
}
.ds-btn:hover { background: var(--panel); }
.ds-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 86px; }
.ds-btn.primary:hover { background: #005f96; }
.ds-btn:disabled { opacity: 0.45; cursor: default; }
.ds-scrub { flex: 1 1 160px; accent-color: var(--accent); min-width: 120px; }
.ds-dots { display: flex; gap: 5px; align-items: center; }
.ds-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); border: 0; padding: 0; cursor: pointer; }
.ds-dot[aria-current="true"] { background: var(--accent); transform: scale(1.25); }
.ds-dot.done { background: #8fb9d6; }
.ds-speed { font-size: 12.5px; color: var(--ink-faint); display: inline-flex; gap: 6px; align-items: center; }
.ds-speed select { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; background: #fff; color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  .ds-card { animation: none; }
}

/* DNA Studio, lecture deck: a 1600 x 900 stage scaled to the window. Large type for a projector,
   one idea per slide, the key number or sentence always the most prominent element. */
html, body { height: 100%; background: #0a1220; overflow: hidden; }
.deck { position: fixed; inset: 0; background: #0a1220; outline: none; user-select: none; }
.deck-stage {
  position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: 0 0;
  background: #fbfcfd; overflow: hidden; box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
}
.slide {
  position: absolute; inset: 0; padding: 62px 84px 86px; display: flex; flex-direction: column;
  opacity: 0; transform: translateX(26px); transition: opacity 0.34s ease, transform 0.34s ease;
  pointer-events: none; color: var(--ink);
}
.slide.back { transform: translateX(-26px); }
.slide.active { opacity: 1; transform: none; pointer-events: auto; }
.slide-kicker {
  font-size: 19px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
}
.slide-kicker::before { content: ""; width: 34px; height: 4px; background: var(--accent); border-radius: 2px; }
.slide-title { font-family: var(--serif); font-size: 52px; line-height: 1.12; font-weight: 700; margin: 0 0 22px; letter-spacing: -0.01em; }
.slide-body { flex: 1 1 auto; min-height: 0; display: grid; gap: 44px; }
.layout-split .slide-body { grid-template-columns: minmax(0, 0.86fr) minmax(0, 1fr); }
.layout-split.wide-figure .slide-body { grid-template-columns: minmax(0, 0.62fr) minmax(0, 1fr); }
.layout-figure .slide-body { grid-template-rows: minmax(0, 1fr) auto; gap: 16px; }
.slide-text { display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.lead { font-size: 29px; line-height: 1.36; color: var(--ink); margin: 0; }
.lead b, .points b { color: var(--ink); font-weight: 700; }
.lead em.term, .points em.term { font-style: normal; font-weight: 700; color: var(--accent); }
.points { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 13px; }
.points li { font-size: 24px; line-height: 1.38; color: var(--ink-soft); padding-left: 30px; position: relative; }
.points li::before { content: ""; position: absolute; left: 4px; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.points.small li { font-size: 21px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.fact { background: #fff; border: 1px solid var(--line); border-left: 6px solid var(--accent); border-radius: 12px; padding: 14px 18px 12px; }
.fact.signal { border-left-color: var(--signal); }
.fact.good { border-left-color: var(--good); }
.fact-value { font-family: var(--serif); font-size: 40px; font-weight: 700; line-height: 1.05; color: var(--ink); white-space: nowrap; }
.fact-value.long { font-size: 30px; white-space: normal; }
.fact-label { font-size: 18px; color: var(--ink-soft); margin-top: 6px; line-height: 1.3; }
.fact-source { font-size: 14px; color: var(--ink-faint); margin-top: 6px; }
.takeaway {
  background: var(--ink); color: #fff; border-radius: 14px; padding: 16px 24px; font-size: 25px;
  line-height: 1.35; font-weight: 600; display: flex; gap: 16px; align-items: center;
}
.takeaway::before { content: "Key point"; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #8fd0ff; font-weight: 700; white-space: nowrap; }
.takeaway b { color: #ffd98a; }
.slide-figure { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.figure-box { flex: 1 1 auto; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
.figure-box.stage { background: var(--stage); border-radius: 18px; overflow: hidden; }
.figure-box .ds-mol, .figure-box .ds-proc { height: auto; }
.figure-box .ds-mol .ds-stage { border-radius: 18px; }
.figure-box .ds-mol .ds-legend { position: absolute; left: 18px; bottom: 12px; z-index: 4; color: var(--stage-soft); font-size: 15px; }
.figure-box .ds-mol .ds-hint { display: none; }
.figure-box .ds-proc { gap: 12px; }
.figure-box .ds-proc .ds-step-title { font-size: 25px; }
.figure-box .ds-proc .ds-step-text { font-size: 20px; }
.figure-box .ds-proc .ds-step-no { width: 48px; height: 48px; font-size: 21px; }
.figure-box .ds-proc .ds-btn { font-size: 16px; padding: 8px 15px; }
.figure-box .ds-proc .ds-proc-caption { padding: 14px 20px; }
.figure-pair { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.figure-pair > div { position: relative; min-height: 0; }
.figure-pair .pair-title { position: absolute; left: 16px; top: 12px; z-index: 5; color: #fff; font-size: 19px; font-weight: 700; }
.figure-box img { width: 100%; height: 100%; object-fit: contain; }
.figure-box svg { max-width: 100%; max-height: 100%; }
.figure-box .html-figure { width: 100%; max-height: 100%; }
.figure-caption { font-size: 17px; color: var(--ink-faint); line-height: 1.35; }
.slide-sources { position: absolute; left: 84px; right: 300px; bottom: 34px; font-size: 14.5px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slide-sources b { font-weight: 600; color: var(--ink-soft); }

.deck-table { border-collapse: collapse; width: 100%; font-size: 21px; }
.deck-table th { text-align: left; font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); padding: 8px 14px; border-bottom: 2px solid var(--ink); }
.deck-table td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--ink-soft); vertical-align: top; line-height: 1.3; }
.deck-table td:first-child { color: var(--ink); font-weight: 700; }
.deck-table td.num { font-family: var(--serif); font-weight: 700; color: var(--ink); white-space: nowrap; }
.deck-table .tag { display: inline-block; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.deck-table .tag.signal { background: var(--signal-soft); color: var(--signal); }
.deck-table .tag.good { background: #dff5ee; color: #007a59; }
.deck-table code, .lead code, .points code { font-family: var(--mono); font-size: 0.92em; background: var(--panel); padding: 1px 6px; border-radius: 5px; color: var(--ink); }
.formula { font-family: var(--serif); font-size: 34px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 12px; color: var(--ink); }
.formula small { display: block; font-family: var(--sans); font-size: 17px; color: var(--ink-faint); margin-top: 6px; }
.codon-table { font-size: 17px !important; }
.codon-table td { padding: 5px 12px !important; }

/* title slide */
.layout-title { padding: 0; background: var(--stage); color: #fff; }
.layout-title .title-grid { position: absolute; inset: 0; display: grid; grid-template-columns: 1.05fr 0.95fr; }
.layout-title .title-text { padding: 150px 40px 80px 96px; display: flex; flex-direction: column; justify-content: center; gap: 26px; z-index: 2; }
.layout-title .title-kicker { font-size: 20px; letter-spacing: 0.18em; text-transform: uppercase; color: #8fd0ff; font-weight: 700; }
.layout-title h1 { font-family: var(--serif); font-size: 78px; line-height: 1.04; margin: 0; letter-spacing: -0.015em; color: #fff; }
.layout-title .title-sub { font-size: 28px; line-height: 1.4; color: #c5d3e4; max-width: 640px; }
.layout-title .title-meta { font-size: 18px; color: #8ea2ba; margin-top: 20px; line-height: 1.5; }
.layout-title .title-figure { position: relative; }
.layout-title .title-figure .ds-mol { position: absolute; inset: 0; height: auto; }
.layout-title .title-figure .ds-stage { border-radius: 0; box-shadow: none; }
.layout-title .title-figure .ds-legend, .layout-title .title-figure .ds-hint { display: none; }

/* outline, summary, references */
.outline { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 28px; align-content: center; }
.outline-item { display: flex; gap: 20px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; cursor: pointer; transition: border-color 0.15s, transform 0.15s; }
.outline-item:hover { border-color: var(--accent); transform: translateY(-1px); }
.outline-no { font-family: var(--serif); font-size: 44px; font-weight: 700; color: var(--accent); width: 54px; text-align: center; }
.outline-name { font-size: 27px; font-weight: 700; color: var(--ink); }
.outline-what { font-size: 19px; color: var(--ink-soft); margin-top: 3px; line-height: 1.3; }
.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 28px; align-content: center; counter-reset: s; }
.summary-item { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px 18px 76px; position: relative; font-size: 23px; line-height: 1.36; color: var(--ink-soft); }
.summary-item::before { counter-increment: s; content: counter(s); position: absolute; left: 22px; top: 16px; width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 700; font-size: 20px; display: flex; align-items: center; justify-content: center; }
.summary-item b { color: var(--ink); }
.references { columns: 2; column-gap: 48px; font-size: 14.6px; line-height: 1.34; color: var(--ink-soft); }
.references p { margin: 0 0 7px; break-inside: avoid; padding-left: 16px; text-indent: -16px; }
.references .ref-topic { font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; font-size: 12.5px; margin: 8px 0 4px; padding: 0; text-indent: 0; }
.references .unchecked { color: var(--signal); font-weight: 600; }

/* chrome */
.deck-progress { position: absolute; left: 0; top: 0; height: 5px; background: var(--accent); transition: width 0.3s ease; z-index: 20; }
.deck-footer { position: absolute; right: 30px; bottom: 22px; display: flex; align-items: center; gap: 8px; z-index: 20; }
.deck-footer button {
  border: 1px solid var(--line); background: rgba(255, 255, 255, 0.92); color: var(--ink-soft); border-radius: 9px;
  height: 38px; min-width: 38px; padding: 0 11px; font-size: 16px; font-weight: 600; cursor: pointer;
}
.deck-footer button:hover { background: #fff; color: var(--ink); border-color: var(--accent); }
.deck-footer button:disabled { opacity: 0.35; cursor: default; }
.deck-count { font-size: 16px; color: var(--ink-faint); min-width: 74px; text-align: center; font-variant-numeric: tabular-nums; }
.deck.on-dark .deck-count { color: #9fb0c5; }
.deck-section { position: absolute; left: 84px; bottom: 60px; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); z-index: 20; display: none; }
.deck-overview { position: absolute; inset: 0; background: rgba(10, 18, 32, 0.97); z-index: 40; padding: 56px 70px; overflow: auto; display: none; color: #fff; }
.deck-overview.open { display: block; }
.deck-overview h2 { font-family: var(--serif); font-size: 34px; margin: 0 0 6px; }
.deck-overview .ov-help { color: #9fb0c5; font-size: 16px; margin-bottom: 18px; }
.ov-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.ov-item { text-align: left; border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.05); color: #e8eef6; border-radius: 10px; padding: 10px 14px; font-size: 16px; cursor: pointer; min-height: 70px; }
.ov-item:hover, .ov-item.current { border-color: #8fd0ff; background: rgba(143, 208, 255, 0.12); }
.ov-item small { display: block; color: #8fd0ff; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
.deck-toast { position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 17px; z-index: 50; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
.deck-toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .slide { transition: none; } }

</style>
</head>

"],"facts":[{"value":"4","label":"kinds of nucleotide","source":"","tone":""},{"value":"2","label":"strands, running in opposite directions","source":"","tone":"good"}],"figure":{"type":"viewer","scene":"schematic","options":{"spin":true,"colour":"base","zoom":1.05},"caption":"Teaching model of letters 1 to 32 of the phiX174 genome: one bead per phosphate, sugar and base."},"sources":["Avery et al. 1944","Hershey & Chase 1952","Watson & Crick 1953","Franklin & Gosling 1953","Wilkins et al. 1953"]},{"section":"Structure","layout":"split","title":"A nucleotide has three parts","kicker":"1 · Structure","lead":"Each nucleotide is a <b>phosphate<\/b> group, the sugar <b>deoxyribose<\/b> and one of four <b>bases<\/b>.","points":["The carbons of the sugar are numbered 1′ to 5′. The base sits on <b>1′<\/b>, the phosphate on <b>5′<\/b>, a free OH group on <b>3′<\/b>.","Nucleotides are joined 3′ to 5′ by <b>phosphodiester bonds<\/b>: this is the <b>sugar-phosphate backbone<\/b>.","So every strand has a <b>direction<\/b>, written <b>5′ → 3′<\/b>. All enzymes that build DNA or RNA add to the 3′ end."],"takeaway":"The backbone is the same everywhere; <b>only the bases differ<\/b>, and they carry the information.","figure":{"type":"html","html":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 700 410\" role=\"img\" aria-label=\"A nucleotide: phosphate, deoxyribose and base\" font-family=\"'Segoe UI', system-ui, -apple-system, Arial, sans-serif\" style=\"width:100%;height:auto;max-height:100%;display:block\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#10243b\"/><\/marker><marker id=\"ah-accent\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#0072b2\"/><\/marker><marker id=\"ah-soft\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a97a8\"/><\/marker><marker id=\"ah-signal\" viewBox=\"0 0 10 10\" refX=\"8.5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#d55e00\"/><\/marker><\/defs><polygon points=\"360,150 428,198 402,276 318,276 292,198\" fill=\"#ece8f8\" stroke=\"#7a68c0\" stroke-width=\"3\"/><text x=\"360.0\" y=\"232.0\" font-size=\"15\" fill=\"#5a4aa8\" font-weight=\"700\" text-anchor=\"middle\">deoxyribose<\/text><text x=\"360.0\" y=\"251.0\" font-size=\"14.8\" fill=\"#5a4aa8\" font-weight=\"400\" text-anchor=\"middle\">(sugar)<\/text><circle cx=\"360\" cy=\"150\" r=\"15\" fill=\"#fff\" stroke=\"#7a68c0\" stroke-width=\"2\"/><text x=\"360.0\" y=\"155.0\" font-size=\"14\" fill=\"#5a4aa8\" font-weight=\"700\" text-anchor=\"middle\">O<\/text><circle cx=\"428\" cy=\"198\" r=\"5\" fill=\"#7a68c0\"/><text x=\"448.0\" y=\"192.0\" font-size=\"15\" fill=\"#10243b\" font-weight=\"700\" text-anchor=\"middle\">1′<\/text><circle cx=\"402\" cy=\"276\" r=\"5\" fill=\"#7a68c0\"/><text x=\"424.0\" y=\"288.0\" font-size=\"15\" fill=\"#10243b\" font-weight=\"700\" text-anchor=\"middle\">2′<\/text><circle cx=\"318\" cy=\"276\" r=\"5\" fill=\"#7a68c0\"/><text x=\"296.0\" y=\"288.0\" font-size=\"15\" fill=\"#10243b\" font-weight=\"700\" text-anchor=\"middle\">3′<\/text><circle cx=\"292\" cy=\"198\" r=\"5\" fill=\"#7a68c0\"/><text x=\"272.0\" y=\"192.0\" font-size=\"15\" fill=\"#10243b\" font-weight=\"700\" text-anchor=\"middle\">4′<\/text><line x1=\"292.0\" y1=\"198.0\" x2=\"250.0\" y2=\"140.0\" stroke=\"#7a68c0\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"250\" cy=\"140\" r=\"5\" fill=\"#7a68c0\"/><text x=\"262.0\" y=\"124.0\" font-size=\"15\" fill=\"#10243b\" font-weight=\"700\" text-anchor=\"middle\">5′<\/text><line x1=\"250.0\" y1=\"140.0\" x2=\"178.0\" y2=\"140.0\" stroke=\"#b9770a\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"126\" cy=\"140\" r=\"52\" fill=\"#fdf0d9\" stroke=\"#e69f00\" stroke-width=\"3\"/><text x=\"126.0\" y=\"136.0\" font-size=\"15\" fill=\"#9a6400\" font-weight=\"700\" text-anchor=\"middle\">phosphate<\/text><text x=\"126.0\" y=\"156.0\" font-size=\"14\" fill=\"#9a6400\" font-weight=\"400\" text-anchor=\"middle\">PO₄<\/text><text x=\"126.0\" y=\"74.0\" font-size=\"14.2\" fill=\"#4a5b70\" font-weight=\"400\" text-anchor=\"middle\">negatively charged:<\/text><text x=\"126.0\" y=\"90.0\" font-size=\"14.2\" fill=\"#4a5b70\" font-weight=\"400\" text-anchor=\"middle\">DNA is an acid<\/text><line x1=\"428.0\" y1=\"198.0\" x2=\"498.0\" y2=\"150.0\" stroke=\"#2f86d6\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"628.0,126.0 597.0,179.7 535.0,179.7 504.0,126.0 535.0,72.3 597.0,72.3\" fill=\"#dceefb\" stroke=\"#2f86d6\" stroke-width=\"3\"/><text x=\"566.0\" y=\"122.0\" font-size=\"16\" fill=\"#1b5fa3\" font-weight=\"700\" text-anchor=\"middle\">base<\/text><text x=\"566.0\" y=\"142.0\" font-size=\"14.8\" fill=\"#1b5fa3\" font-weight=\"400\" text-anchor=\"middle\">A, T, G or C<\/text><text x=\"566.0\" y=\"44.0\" font-size=\"14.2\" fill=\"#4a5b70\" font-weight=\"400\" text-anchor=\"middle\">carries the information<\/text><line x1=\"318.0\" y1=\"276.0\" x2=\"318.0\" y2=\"330.0\" stroke=\"#d55e00\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"318.0\" y=\"352.0\" font-size=\"17\" fill=\"#d55e00\" font-weight=\"700\" text-anchor=\"middle\">OH<\/text><text x=\"318.0\" y=\"374.0\" font-size=\"14.2\" fill=\"#4a5b70\" font-weight=\"400\" text-anchor=\"middle\">3′ end: the next nucleotide<\/text><text x=\"318.0\" y=\"390.0\" font-size=\"14.2\" fill=\"#4a5b70\" font-weight=\"400\" text-anchor=\"middle\">is attached here<\/text><line x1=\"402.0\" y1=\"276.0\" x2=\"402.0\" y2=\"322.0\" stroke=\"#7a68c0\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"402.0\" y=\"344.0\" font-size=\"17\" fill=\"#5a4aa8\" font-weight=\"700\" text-anchor=\"middle\">H<\/text><text x=\"486.0\" y=\"340.0\" font-size=\"14.2\" fill=\"#4a5b70\" font-weight=\"400\" text-anchor=\"start\">no oxygen at 2′: “deoxy”<\/text><text x=\"486.0\" y=\"356.0\" font-size=\"14.2\" fill=\"#4a5b70\" font-weight=\"400\" text-anchor=\"start\">(RNA has OH here)<\/text><line x1=\"420.0\" y1=\"338.0\" x2=\"480.0\" y2=\"338.0\" stroke=\"#8a97a8\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-dasharray=\"3 4\"/><text x=\"196.0\" y=\"214.0\" font-size=\"14.2\" fill=\"#4a5b70\" font-weight=\"400\" text-anchor=\"middle\">5′ end: the phosphate<\/text><text x=\"196.0\" y=\"230.0\" font-size=\"14.2\" fill=\"#4a5b70\" font-weight=\"400\" text-anchor=\"middle\">hangs on carbon 5′<\/text><\/svg>","caption":"Schematic drawing; the next slide shows the real atoms."},"cls":""},{"section":"Structure","layout":"split","title":"The same nucleotide, as measured by X-ray crystallography","kicker":"1 · Structure","lead":"One real <b>deoxyadenosine nucleotide<\/b> from the crystal structure of a DNA double helix (PDB entry 1BNA, resolution 1.9 Å).","points":["21 atoms other than hydrogen; hydrogen is too light to be seen at this resolution.","<b>Orange<\/b>: phosphate group. <b>Violet<\/b>: the five-membered sugar ring. <b>Blue<\/b>: adenine, a flat system of two fused rings.","The flat base is what allows bases to <b>stack<\/b> on each other inside the helix."],"figure":{"type":"viewer","scene":"nucleotide","options":{"colour":"component","atomLabels":true,"selectable":false,"style":"ballstick","zoom":1.0},"caption":"Atom names as in the PDB file. Drag to rotate."},"sources":["Drew et al. 1981","PDB 1BNA"]},{"section":"Structure","layout":"split","title":"Base pairing: A with T, G with C","kicker":"1 · Structure","cls":"wide-figure","lead":"A <b>purine<\/b> (A or G, two rings) always pairs with a <b>pyrimidine<\/b> (T or C, one ring), held by <b>hydrogen bonds<\/b>.","points":["<b>A·T: 2<\/b> hydrogen bonds. <b>G·C: 3<\/b> hydrogen bonds, so G·C-rich DNA is harder to separate.","Measured here on 1BNA: all 32 hydrogen bonds are 2.61 to 3.25 Å long.","Both pairs are equally wide (10.6 Å from sugar to sugar): the helix has the same diameter along its whole length."],"takeaway":"One strand <b>determines<\/b> the other. This is the basis of heredity.","figure":{"type":"viewers","items":[{"title":"Adenine · Thymine","scene":"pair_at","options":{"colour":"element","distanceLabels":true,"selectable":false}},{"title":"Guanine · Cytosine","scene":"pair_gc","options":{"colour":"element","distanceLabels":true,"selectable":false}}],"caption":"Two real base pairs of 1BNA seen along the helix axis; distances between the bonded atoms in ångström, measured from the coordinates."},"sources":["Watson & Crick 1953","PDB 1BNA"]},{"section":"Structure","layout":"split","title":"The double helix: two antiparallel strands","kicker":"1 · Structure","lead":"The two strands wind around a common axis as a <b>right-handed<\/b> helix and run in <b>opposite directions<\/b>: one 5′→3′, its partner 3′→5′.","points":["Outside: the charged sugar-phosphate <b>backbones<\/b>. Inside: the stacked <b>base pairs<\/b>, protected from water.","The two backbones are not opposite each other, which leaves a wide <b>major groove<\/b> and a narrow <b>minor groove<\/b>, where proteins read the sequence."],"facts":[{"value":"3.37 Å","label":"rise per base pair, measured on 1BNA","source":"published: 0.34 nm (Watson & Crick 1953)","tone":""},{"value":"10.1","label":"base pairs per turn, measured on 1BNA","source":"in solution: 10.4 ± 0.1 (Wang 1979)","tone":"good"}],"figure":{"type":"viewer","scene":"atomic","options":{"colour":"strand","spin":true,"zoom":1.0},"caption":"All 486 DNA atoms of PDB 1BNA (sequence CGCGAATTCGCG). Click a nucleotide to see its partner and its hydrogen bonds."},"sources":["Drew et al. 1981","Wang 1979","Watson & Crick 1953"]},{"section":"Structure","layout":"text","title":"The helix in numbers: measured here, compared with the literature","kicker":"1 · Structure","html":"<table class=\"deck-table\"><thead><tr><th>Quantity<\/th><th>Measured on PDB 1BNA by this program<\/th><th>Published value<\/th><\/tr><\/thead><tbody><tr><td>Rise per base pair<\/td><td class=\"num\">3.37 ± 0.24 Å<\/td><td>0.34 nm (Watson & Crick 1953)<\/td><\/tr><tr><td>Rotation per base pair (twist)<\/td><td class=\"num\">35.7 ± 4.5°, right-handed<\/td><td>36.9° per step (Drew et al. 1981)<\/td><\/tr><tr><td>Base pairs per turn<\/td><td class=\"num\">10.1<\/td><td>10.0 in fibres, 10.4 ± 0.1 in solution (Wang 1979)<\/td><\/tr><tr><td>Phosphorus atoms from the axis<\/td><td class=\"num\">9.3 Å (so about 1.9 nm across)<\/td><td>about 2 nm (Watson & Crick 1953)<\/td><\/tr><tr><td>Watson-Crick hydrogen bonds<\/td><td class=\"num\">32 in 12 pairs, 2.61 to 3.25 Å (mean 2.83 Å)<\/td><td>2 per A·T pair, 3 per G·C pair<\/td><\/tr><tr><td>Sugar to sugar across a pair (C1′ to C1′)<\/td><td class=\"num\">10.6 Å for A·T and G·C alike<\/td><td>one purine + one pyrimidine: every pair has the same width<\/td><\/tr><\/tbody><\/table>","takeaway":"The measurements on real coordinates <b>agree<\/b> with the published structure of B-DNA; nothing on these slides is a drawing from memory.","sources":["Drew et al. 1981","Watson & Crick 1953","Wang 1979"]},{"section":"Structure","layout":"split","title":"Chargaff’s rule, checked on the two genomes of this project","kicker":"1 · Structure","lead":"If A pairs with T and G with C, a double helix must contain <b>as much A as T and as much G as C<\/b>.","points":["<b>phiX174<\/b>: A 24.0% but T 31.3%. The rule fails, and correctly so: inside the virus this genome is a <b>single strand<\/b>.","<b>lambda<\/b>, a double-stranded genome: on one strand A 25.4% and T 24.7%, already close; counted over both strands they are equal by construction."],"takeaway":"Unequal amounts of A and T are the signature of a <b>single-stranded<\/b> genome.","figure":{"type":"html","html":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\" anscript<\/text><\/svg>","caption":"11 protein-coding genes in 5,386 nucleotides (NCBI annotation). Each row is one of the three reading frames; genes that share DNA lie on different rows (A/A*, A/B, A/K, A/C, A*/B, A*/K …). ↩ the genome is a circle: these genes continue at position 1."},"takeaway":"The genes add up to <b>7,014<\/b> nucleotides, more than the genome has (<b>5,386<\/b>): the same DNA serves <b>more than one gene<\/b>, partly in different reading frames. phiX174, 1977: the first DNA genome ever sequenced.","sources":["Sanger et al. 1977","Barrell et al. 1976","NCBI NC_001422.1"]},{"section":"Replication","layout":"figure","title":"Replication: each strand is the template for a new one","kicker":"3 · Replication","figure":{"type":"process","scenario":"replication"},"sources":["Meselson & Stahl 1958","Okazaki et al. 1968","NCBI NC_001416.1"]},{"section":"Replication","layout":"text","title":"Replication in numbers","kicker":"3 · Replication","lead":"Replication is <b>semiconservative<\/b>, runs only <b>5′ → 3′<\/b>, and is fast and extremely accurate.","facts":[{"value":"1 old + 1 new strand","label":"Replication is semiconservative","source":"Meselson & Stahl 1958 (textbook value)","tone":"good"},{"value":"up to about 1,000 nt per second","label":"Speed of a bacterial replication fork","source":"Alberts et al. 2022 (textbook value)","tone":""},{"value":"about 1 error per 10⁹ to 10¹⁰ nt","label":"Fidelity of replication","source":"Alberts et al. 2022 (textbook value)","tone":"signal"},{"value":"1,000 to 2,000 nt (bacteria)","label":"Okazaki fragments","source":"Alberts et al. 2022 (textbook value)","tone":""}],"points":["<b>Why it matters:<\/b> every cell division must hand a complete, correct copy of the genome to both daughter cells.","The rare errors that remain are one source of <b>mutations<\/b> (part 5)."],"sources":["Meselson & Stahl 1958","Okazaki et al. 1968","Alberts et al. 2022"]},{"section":"Expression","layout":"split","title":"The central lti-armed bandit<\/b> learns which pair to use<\/td><td>the method under test<\/td><\/tr><\/tbody><\/table>","takeaway":"Research question, fixed before the experiments: does a <b>bandit<\/b> choose operators better than <b>random choice<\/b> under the same time budget?","sources":["Glover 1989","Helsgaun 2000","Ropke & Pisinger 2006","Auer et al. 2002"]},{"section":"Sequencing and assembly","layout":"split","title":"Result: an honest negative answer","kicker":"6 · Sequencing and assembly","cls":"wide-figure","lead":"<b>300<\/b> read sets (10 settings × 30 seeds), every solver with the same <b>8 seconds<\/b>.","points":["<b>The pre-registered claim is not supported<\/b>: UCB1 is not different from random choice (p = 0.90, A12 = 0.52); epsilon-greedy is slightly worse (A12 = 0.46).","LKH-3 was <b>never beaten<\/b>; ALNS beats greedy and tabu search.","<b>Post hoc, exploratory only<\/b>: UCB1 with random tie-breaking is slightly better than random (A12 = 0.57, p = 0.0002). It was added after seeing the results and is not a confirmation."],"figure":{"type":"html","html":"<table class=\"deck-table\"><thead><tr><th>Solver<\/th><th>Mean gap to best<\/th><th>Contigs<\/th><th>Identity<\/th><\/tr><\/thead><tbody><tr><td>Greedy<\/td><td class=\"num\">0.88%<\/td><td class=\"num\">39<\/td><td class=\"num\">99.36%<\/td><\/tr><tr><td>Tabu search<\/td><td class=\"num\">0.59%<\/td><td class=\"num\">39<\/td><td class=\"num\">99.37%<\/td><\/tr><tr><td>ALNS, random choice<\/td><td class=\"num\">0.20%<\/td><td class=\"num\">34<\/td><td class=\"num\">99.49%<\/td><\/tr><tr><td>ALNS, UCB1<\/td><td class=\"num\">0.20%<\/td><td class=\"num\">34<\/td><td class=\"num\">99.49%<\/td><\/tr><tr><td>ALNS, UCB1 with random ties (post hoc)<\/td><td class=\"num\">0.18%<\/td><td class=\"num\">33<\/td><td class=\"num\">99.49%<\/td><\/tr><tr><td>LKH-3<\/td><td class=\"num\">0.00%<\/td><td class=\"num\">29<\/td><td class=\"num\">99.54%<\/td><\/tr><\/tbody><\/table>","caption":"Gap: how far the fitness is below the best solution found on the same read set (lower is better). Contigs and identity are measured against the real genome. Source: results/phase5."}},{"section":"Summary","layout":"summary","title":"What to remember","kicker":"Summary","points":["DNA is a <b>double helix of two antiparallel strands<\/b>; A pairs with T (2 hydrogen bonds), G with C (3).","The helix measured here on real atoms: <b>3.37 Å<\/b> per base pair, <b>10.1<\/b> base pairs per turn, right-handed.","<b>Replication<\/b> is semiconservative and runs 5′→3′: one strand continuously, the other in Okazaki fragments.","<b>Transcription<\/b> copies a gene into RNA; <b>translation<\/b> reads codons of three letters: gene J of phiX174 gives a protein of 38 amino acids.","A <b>mutation<\/b> can be silent, change one amino acid, stop the protein early or shift the whole reading frame.","Sequencing gives short reads; <b>assembly<\/b> orders them by their overlaps, which is an asymmetric <b>travelling salesman problem<\/b>."]},{"section":"References","layout":"references","title":"References (1 of 2)","kicker":"Sources","html":"<p class=\"ref-topic\">structure<\/p><p>Berman HM et al. (2000). The Protein Data Bank. Nucleic Acids Research 28: 235–242. doi:10.1093/nar/28.1.235<\/p><p>Bondi A (1964). van der Waals Volumes and Radii. The Journal of Physical Chemistry 68: 441–451. doi:10.1021/j100785a001<\/p><p>Chargaff E (1950). Chemical specificity of nucleic acids and mechanism of their enzymatic degradation. Experientia 6: 201–209. doi:10.1007/bf02173653<\/p><p>Drew HR, Wing RM, Takano T, Broka C, Tanaka S, Itakura K, Dickerson RE (1981). Structure of a B-DNA dodecamer: conformation and dynamics. Proceedings of the National Academy of Sciences 78: 2179–2183. doi:10.1073/pnas.78.4.2179<\/p><p>Franklin RE, Gosling RG (1953). Molecular Configuration in Sodium Thymonucleate. Nature 171: 740–741. doi:10.1038/171740a0<\/p><p>Wang JC (1979). Helical repeat of DNA in solution. Proceedings of the National Academ   // ---- shaders -----------------------------------------------------------------------------------
  var LIGHTING = [
    "uniform vec3 uBg; uniform vec3 uFog; uniform vec2 uGloss;",
    "vec3 shade(vec3 base, vec3 n, vec3 pos, float emphasis) {",
    "  vec3 v = normalize(-pos);",
    "  vec3 l1 = normalize(vec3(-0.45, 0.65, 0.62));",
    "  vec3 l2 = normalize(vec3(0.70, -0.20, 0.55));",
    "  float d1 = max(dot(n, l1), 0.0);",
    "  float d2 = max(dot(n, l2), 0.0);",
    "  float spec = pow(max(dot(n, normalize(l1 + v)), 0.0), uGloss.x) * uGloss.y;",
    "  vec3 ambient = mix(vec3(0.20, 0.21, 0.26), vec3(0.42, 0.44, 0.48), n.y * 0.5 + 0.5);",
    "  vec3 col = base * (ambient + 0.74 * d1 + 0.20 * d2) + vec3(spec);",
    "  col *= mix(0.50, 1.0, smoothstep(0.0, 0.55, dot(n, v)));",
    "  float fog = clamp((-pos.z - uFog.x) / (uFog.y - uFog.x), 0.0, 1.0) * uFog.z;",
    "  col = mix(col, uBg, fog);",
    "  return mix(uBg, col, mix(0.16, 1.0, emphasis));",
    "}",
  ].join("\n");

  var SPHERE_VS = [
    "#version 300 es",
    "layout(location=0) in vec2 aCorner;",
    "layout(location=1) in vec4 aCenterRadius;",
    "layout(location=2) in vec4 aColor;",
    "uniform mat4 uView; uniform mat4 uProj;",
    "out vec3 vCenter; out float vRadius; out vec4 vColor; out vec3 vPos;",
    "void main() {",
    "  vec4 c = uView * vec4(aCenterRadius.xyz, 1.0);",
    "  vCenter = c.xyz; vRadius = aCenterRadius.w; vColor = aColor;",
    "  vPos = c.xyz + vec3(aCorner * aCenterRadius.w * 1.4, 0.0);",
    "  gl_Position = uProj * vec4(vPos, 1.0);",
    "}",
  ].join("\n");

  var SPHERE_FS = [
    "#version 300 es",
    "precision highp float;",
    "in vec3 vCenter; in float vRadius; in vec4 vColor; in vec3 vPos;",
    "uniform mat4 uProj;",
    LIGHTING,
    "out vec4 fragColor;",
    "void main() {",
    "  vec3 ray = normalize(vPos);",
    "  float b = dot(ray, vCenter);",
    "  float disc = b * b - dot(vCenter, vCenter) + vRadius * vRadius;",
    "  float edge = disc / (vRadius * vRadius);",
    "  float width = fwidth(edge);",
    "  if (disc < 0.0) discard;",
    "  vec3 hit = ray * (b - sqrt(disc));",
    "  vec3 n = normalize(hit - vCenter);",
    "  vec4 clip = uProj * vec4(hit, 1.0);",
    "  gl_FragDepth = clip.z / clip.w * 0.5 + 0.5;",
    "  fragColor = vec4(shade(vColor.rgb, n, hit, vColor.a), smoothstep(0.0, max(width, 1e-5), edge));",
    "}",
  ].join("\n");

  var CYL_VS = [
    "#version 300 es",
    "layout(location=0) in vec3 aPos;",
    "layout(location=1) in vec3 aStart;",
    "layout(location=2) in vec3 aEnd;",
    "layout(location=3) in float aRadius;",
    "layout(location=4) in vec4 aColor;",
    "uniform mat4 uView; uniform mat4 uProj;",
    "out vec3 vNormal; out vec3 vPos; out vec4 vColor;",
    "void main() {",
    "  vec3 axis = aEnd - aStart;",
    "  vec3 dir = normalize(axis);",
    "  vec3 helper = abs(dir.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);",
    "  vec3 u = normalize(cross(dir, helper));",
    "  vec3 w = cross(dir, u);",
    "  vec3 radial = u * aPos.x + w * aPos.z;",
    "  vec4 p = uView * vec4(aStart + axis * aPos.y + radial * aRadius, 1.0);",
    "  vNormal = mat3(uView) * radial; vPos = p.xyz; vColor = aColor;",
    "  gl_Position = uProj * p;",
    "}",
  ].join("\n");

  var CYL_FS = [
    "#version 300 es",
    "precision highp float;",
    "in vec3 vNormal; in vec3 vPos; in vec4 vColor;",
    LIGHTING,
    "out vec4 fragColor;",
    "void main() { fragColor = vec4(shade(vColor.rgb, normalize(vNormal), vPos, vColor.a), 1.0); }",
  ].join("\n");

  function compile(gl, type, source) {
    var shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error("shader: " + gl.getShaderInfoLog(shader));
    }
    return shader;
  }
  function program(gl, vs, fs) {
    var p = gl.createProgram();
    gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error("program: " + gl.getProgramInfoLog(p));
    }
    var uniforms = {};
    var count = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (var i = 0; i < count; i++) {
      var info = gl.getActiveUniform(p, i);
      uniforms[info.name] = gl.getUniformLocation(p, info.name);
    }
    return { id: p, u: uniforms };
  }

  var SEGMENTS = 16;
  var SPHERE_STRIDE = 8; // centre xyz, radius, rgb, emphasis
  var CYL_STRIDE = 11; // start xyz, end xyz, radius, rgb, emphasis

  /* Viewer3D(container, options)
       options.background: "#rrggbb" stage colour (used for fog and dimming)
       options.onPick(index | -1): a click on sphere number index (or on nothing)
       options.onFrame(viewer): called after each frame (for labels drawn on the overlay)
       options.forceCanvas: use the 2D fallback renderer (for testing) */
  function Viewer3D(container, options) {
    this.options = options || {};
    this.container = container;
    this.spheres = new Float32Array(0);
    this.cyls = new Float32Array(0);
    this.nSpheres = 0;
    this.nCyls = 0;
    this.rotation = [0, 0, 0, 1];
    this.center = [0, 0, 0];
    this.sceneRadius = 20;
    this.distance = 100;
    this.fov = (26 * Math.PI) / 180;
    this.spin = false;
    this.spinSpeed = 0.35; // radians per second about the vertical axis of the scene
    this.bg = hexToRgb(this.options.background || "#0b1626");
    this.active = false;
    this.visible = true;
    this.disposed = false;
    this.frameRequested = false;
    this.lastTime = 0;
    this.frames = 0;

    container.style.position = container.style.position || "relative";
    this.canvas = document.createElement("canvas");
    this.overlay = document.createElement("canvas");
    [this.canvas, this.overlay].forEach(function (c) {
      c.style.cssText = "position:absolute;inset:0;width:100%;height:100%;display:block;";
    });
    this.overlay.style.pointerEvents = "none";
    this.canvas.style.touchAction = "none";
    this.canvas.style.cursor = "grab";
    this.canvas.setAttribute("role", "img");
    this.canvas.setAttribute("aria-label", this.options.label || "Interactive 3D model of DNA");
    container.appendChild(this.canvas);
    container.appendChild(this.overlay);
    this.overlayCtx = this.overlay.getContext("2d");

    this.gl = null;
    if (!this.options.forceCanvas) {
      try {
        this.gl = this.canvas.getContext("webgl2", {
          antialias: true, alpha: false, depth: true, powerPreference: "high-performance",
        });
        if (this.gl) this._initGL();
      } catch (error) {
        if (global.console) console.warn("DNA Studio: WebGL 2 unavailable, using the 2D renderer.", error);
        this.gl = null;
      }
    }
    if (!this.gl) {
      // a canvas that was asked for a WebGL context cannot give a 2D context: replace it
      var fresh = this.canvas.cloneNode(false);
      container.replaceChild(fresh, this.canvas);
      this.canvas = fresh;
      this.ctx2d = this.canvas.getContext("2d");
    }
    this.renderer = this.gl ? "webgl2" : "canvas2d";
    this._bindEvents();
    this.resize();
  }

  Viewer3D.prototype._initGL = function () {
    var gl = this.gl;
    this.sphereProgram = program(gl, SPHERE_VS, SPHERE_FS);
    this.cylProgram = program(gl, CYL_VS, CYL_FS);

    this.sphereVao = gl.createVertexArray();
    gl.bindVertexArray(this.sphereVao);
    var quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    this.sphereBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.sphereBuffer);
    var s = SPHERE_STRIDE * 4;
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 4, gl.FLOAT, false, s, 0);
    gl.vertexAttribDivisor(1, 1);
    gl.enableVertexAttribArray(2);
    gl.vertexAttribPointer(2, 4, gl.FLOAT, false, s, 16);
    gl.vertexAttribDivisor(2, 1);

    this.cylVao = gl.createVertexArray();
    gl.bindVertexArray(this.cylVao);
    var mesh = [];
    for (var i = 0; i <= SEGMENTS; i++) {
      var a = (i / SEGMENTS) * Math.PI * 2;
      mesh.push(Math.cos(a), 0, Math.sin(a), Math.cos(a), 1, Math.sin(a));
    }
    this.cylVertices = mesh.length / 3;
    var meshBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, meshBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(mesh), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    this.cylBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.cylBuffer);
    var c = CYL_STRIDE * 4;
    [[1, 3, 0], [2, 3, 12], [3, 1, 24], [4, 4, 28]].forEach(function (spec) {
      gl.enableVertexAttribArray(spec[0]);
      gl.vertexAttribPointer(spec[0], spec[1], gl.FLOAT, false, c, spec[2]);
      gl.vertexAttribDivisor(spec[0], 1);
    });
    gl.bindVertexArray(null);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
    var self = this;
    this.canvas.addEventListener("webglcontextlost", function (event) {
      event.preventDefault();
      self.contextLost = true;
    });
    this.canvas.addEventListener("webglcontextrestored", function () {
      self.contextLost = false;
      self._initGL();
      self._upload();
      self.invalidate();
    });
  };

  /* setData(spheres, cylinders): Float32Arrays with 8 and 11 numbers per item (see the strides). */
  Viewer3D.prototype.setData = function (spheres, cyls) {
    this.spheres = spheres;
    this.cyls = cyls;
    this.nSpheres = spheres.length / SPHERE_STRIDE;
    this.nCyls = cyls.length / CYL_STRIDE;
    this._upload();
    this.invalidate();
  };

  Viewer3D.prototype._upload = function () {
    var gl = this.gl;
    if (!gl) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.sphereBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, this.spheres, gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.cylBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, this.cyls, gl.DYNAMIC_DRAW);
  };

  /* frame(center, radius): look at a sphere of the given radius; keeps the current rotation. */
  Viewer3D.prototype.frame = function (center, radius, zoom, extent) {
    this.center = center.slice();
    this.sceneRadius = radius;
    this.extent = extent || null; // [half width, half height, half depth] to keep in view
    this.homeZoom = zoom || 1;
    this._fit();
    this.invalidate();
  };

  Viewer3D.prototype._fit = function () {
    var aspect = this.width / Math.max(this.height, 1);
    var half = Math.tan(this.fov / 2);
    var limit = Math.min(half, half * aspect);
    var distance = this.sceneRadius / Math.sin(Math.atan(limit));
    if (this.extent) {
      distance = Math.max(this.extent[1] / half, this.extent[0] / (half * aspect)) + this.extent[2];
    }
    this.homeDistance = distance / (this.homeZoom || 1);
    if (!this.userZoomed) this.distance = this.homeDistance;
  };

  Viewer3D.prototype.setRotation = function (q) {
    this.rotation = qNorm(q);
    this.invalidate();
  };

  Viewer3D.prototype.reset = function (q) {
    this.userZoomed = false;
    this.distance = this.homeDistance;
    this.rotation = q ? qNorm(q) : [0, 0, 0, 1];
    this.invalidate();
  };

  Viewer3D.prototype.zoomBy = function (factor) {
    this.userZoomed = true;
    var d = this.distance * factor;
    this.distance = Math.min(this.homeDistance * 3, Math.max(this.homeDistance * 0.18, d));
    this.invalidate();
  };

  Viewer3D.prototype.setSpin = function (on) {
    this.spin = !!on;
    this.lastTime = 0;
    this.invalidate();
  };

  Viewer3D.prototype.setBackground = function (hex) {
    this.bg = hexToRgb(hex);
    this.invalidate();
  };

  Viewer3D.prototype.resize = function () {
    var rect = this.container.getBoundingClientRect();
    var dpr = Math.min(global.devicePixelRatio || 1, 2);
    this.width = Math.max(1, Math.round(rect.width));
    this.height = Math.max(1, Math.round(rect.height));
    this.dpr = dpr;
    var w = Math.round(this.width * dpr), h = Math.round(this.height * dpr);
    [this.canvas, this.overlay].forEach(function (c) {
      if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    });
    this._fit();
    this.invalidate();
  };

  Viewer3D.prototype._matrices = function () {
    var r = qToRows(this.rotation);
    var c = this.center;
    var tx = -(r[0] * c[0] + r[1] * c[1] + r[2] * c[2]);
    var ty = -(r[3] * c[0] + r[4] * c[1] + r[5] * c[2]);
    var tz = -(r[6] * c[0] + r[7] * c[1] + r[8] * c[2]) - this.distance;
    var aspect = this.width / Math.max(this.height, 1);
    var f = 1 / Math.tan(this.fov / 2);
    var near = Math.max(0.5, this.distance - this.sceneRadius * 1.6);
    var far = this.distance + this.sceneRadius * 1.6;
    this.rows = r;
    this.translation = [tx, ty, tz];
    this.f = f;
    this.aspect = aspect;
    this.view = new Float32Array([
      r[0], r[3], r[6], 0, r[1], r[4], r[7], 0, r[2], r[5], r[8], 0, tx, ty, tz, 1,
    ]);
    this.proj = new Float32Array([
      f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) / (near - far), -1,
      0, 0, (2 * far * near) / (near - far), 0,
    ]);
    this.fog = [this.distance - this.sceneRadius, this.distance + this.sceneRadius * 1.15, 0.62];
  };

  /* toView([x, y, z]) -> position in camera space (camera at the origin, looking along -z). */
  Viewer3D.prototype.toView = function (p) {
    var r = this.rows, t = this.translation;
    return [
      r[0] * p[0] + r[1] * p[1] + r[2] * p[2] + t[0],
      r[3] * p[0] + r[4] * p[1] + r[5] * p[2] + t[1],
      r[6] * p[0] + r[7] * p[1] + r[8] * p[2] + t[2],
    ];
  };

  /* project([x, y, z]) -> {x, y, depth, scale} in CSS pixels of the canvas, or null if behind. */
  Viewer3D.prototype.project = function (p) {
    if (!this.rows) this._matrices();
    var v = this.toView(p);
    if (v[2] > -0.01) return null;
    var k = this.f / -v[2];
    return {
      x: (1 + (k / this.aspect) * v[0]) * this.width / 2,
      y: (1 - k * v[1]) * this.height / 2,
      depth: -v[2],
      scale: (k * this.height) / 2, // CSS pixels per angstrom at that depth
    };
  };

  /* pick(x, y): index of the nearest sphere under a canvas position (CSS pixels), or -1. */
  Viewer3D.prototype.pick = function (x, y) {
    if (!this.rows) this._matrices();
    var dx = ((2 * x) / this.width - 1) * this.aspect / this.f;
    var dy = (1 - (2 * y) / this.height) / this.f;
    var n = Math.hypot(dx, dy, 1);
    var ray = [dx / n, dy / n, -1 / n];
    var best = -1, bestT = Infinity, s = this.spheres;
    for (var i = 0; i < this.nSpheres; i++) {
      var o = i * SPHERE_STRIDE;
      if (this.pickMask && !this.pickMask[i]) continue; // decoration, not pickable
      var c = this.toView([s[o], s[o + 1], s[o + 2]]);
      var b = ray[0] * c[0] + ray[1] * c[1] + ray[2] * c[2];
      var disc = b * b - (c[0] * c[0] + c[1] * c[1] + c[2] * c[2]) + s[o + 3] * s[o + 3];
      if (disc >= 0) {
        var t = b - Math.sqrt(disc);
        if (t > 0 && t < bestT) { bestT = t; best = i; }
      }
    }
    return best;
  };

  Viewer3D.prototype.invalidate = function () {
    if (this.frameRequested || this.disposed) return;
    this.frameRequested = true;
    var self = this;
    global.requestAnimationFrame(function (time) {
      self.frameRequested = false;
      self._frame(time);
    });
  };

  Viewer3D.prototype._frame = function (time) {
    if (this.disposed) return;
    if (this.spin && this.visible && !this.dragging) {
      var dt = this.lastTime ? Math.min(0.05, (time - this.lastTime) / 1000) : 0;
      this.rotation = qNorm(qMul(this.rotation, qAxis(0, 1, 0, dt * this.spinSpeed)));
    }
    this.lastTime = time;
    this.render();
    if (this.spin && this.visible) this.invalidate();
  };

  Viewer3D.prototype.render = function () {
    this._matrices();
    this.frames++;
    if (this.gl) this._renderGL(); else this._renderCanvas();
    var ctx = this.overlayCtx;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, this.width, this.height);
    if (this.options.onFrame) this.options.onFrame(this, ctx);
  };

  Viewer3D.prototype._renderGL = function () {
    var gl = this.gl;
    if (this.contextLost) return;
    gl.viewport(0, 0, this.canvas.width, this.canvas.height);
    gl.clearColor(this.bg[0], this.bg[1], this.bg[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    var self = this;
    function common(p) {
      gl.useProgram(p.id);
      gl.uniformMatrix4fv(p.u.uView, false, self.view);
      gl.uniformMatrix4fv(p.u.uProj, false, self.proj);
      gl.uniform3fv(p.u.uBg, self.bg);
      gl.uniform3fv(p.u.uFog, self.fog);
      gl.uniform2f(p.u.uGloss, 42.0, 0.22);
    }
    if (this.nCyls) {
      common(this.cylProgram);
      gl.bindVertexArray(this.cylVao);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, this.cylVertices, this.nCyls);
    }
    if (this.nSpheres) {
      common(this.sphereProgram);
      gl.bindVertexArray(this.sphereVao);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, this.nSpheres);
    }
    gl.bindVertexArray(null);
  };

  // 2D fallback: painter's algorithm (far to near), spheres as shaded discs, bonds as thick lines.
  Viewer3D.prototype._renderCanvas = function () {
    var ctx = this.ctx2d, items = [], i, o, a, b;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    var bg = this.bg;
    function css(r, g, bl, k) {
      function ch(v, base) { return Math.round(255 * (base + (v - base) * k)); }
      return "rgb(" + ch(r, bg[0]) + "," + ch(g, bg[1]) + "," + ch(bl, bg[2]) + ")";
    }
    ctx.fillStyle = css(bg[0], bg[1], bg[2], 1);
    ctx.fillRect(0, 0, this.width, this.height);
    var s = this.spheres, c = this.cyls;
    for (i = 0; i < this.nSpheres; i++) {
      o = i * SPHERE_STRIDE;
      a = this.project([s[o], s[o + 1], s[o + 2]]);
      if (a) items.push({ z: a.depth, kind: 0, a: a, r: s[o + 3] * a.scale, o: o });
    }
    for (i = 0; i < this.nCyls; i++) {
      o = i * CYL_STRIDE;
      a = this.project([c[o], c[o + 1], c[o + 2]]);
      b = this.project([c[o + 3], c[o + 4], c[o + 5]]);
      if (a && b) items.push({ z: (a.depth + b.depth) / 2, kind: 1, a: a, b: b, r: c[o + 6] * a.scale, o: o });
    }
    items.sort(function (p, q) { return q.z - p.z; });
    var near = this.fog[0], far = this.fog[1];
    for (i = 0; i < items.length; i++) {
      var it = items[i];
      var fade = 1 - Math.min(1, Math.max(0, (it.z - near) / (far - near))) * this.fog[2];
      if (it.kind === 0) {
        var k = fade * (0.16 + 0.84 * Math.max(0, s[it.o + 7]));
        var g = ctx.createRadialGradient(it.a.x - it.r * 0.35, it.a.y - it.r * 0.4, it.r * 0.1, it.a.x, it.a.y, it.r);
        g.addColorStop(0, css(Math.min(1, s[it.o + 4] + 0.35), Math.min(1, s[it.o + 5] + 0.35), Math.min(1, s[it.o + 6] + 0.35), k));
        g.addColorStop(0.6, css(s[it.o + 4], s[it.o + 5], s[it.o + 6], k));
        g.addColorStop(1, css(s[it.o + 4] * 0.45, s[it.o + 5] * 0.45, s[it.o + 6] * 0.45, k));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(it.a.x, it.a.y, Math.max(it.r, 0.5), 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.strokeStyle = css(c[it.o + 7] * 0.85, c[it.o + 8] * 0.85, c[it.o + 9] * 0.85, fade * (0.16 + 0.84 * c[it.o + 10]));
        ctx.lineWidth = Math.max(1, it.r * 2);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(it.a.x, it.a.y);
        ctx.lineTo(it.b.x, it.b.y);
        ctx.stroke();
      }
    }
  };

  Viewer3D.prototype._bindEvents = function () {
    var self = this, canvas = this.canvas, last = null, moved = 0, pointers = {};
    function position(event) {
      var rect = canvas.getBoundingClientRect();
      return [event.clientX - rect.left, event.clientY - rect.top];
    }
    this._onDown = function (event) {
      pointers[event.pointerId] = position(event);

  function rounded(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* One nucleotide: a coloured tile with its letter. RNA nucleotides get a light ring. */
  function tile(ctx, x, y, letter, o) {
    o = o || {};
    var s = o.size || 30, w = o.width || s, alpha = o.alpha === undefined ? 1 : o.alpha;
    if (alpha <= 0.01) return;
    ctx.save();
    ctx.globalAlpha *= alpha;
    rounded(ctx, x - w / 2, y - s / 2, w, s, o.rna ? s * 0.34 : 6);
    ctx.fillStyle = BASE[letter] || "#667";
    ctx.fill();
    if (o.rna) { ctx.lineWidth = 2.2; ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.stroke(); }
    if (o.ring) { ctx.lineWidth = 3; ctx.strokeStyle = o.ring; ctx.stroke(); }
    ctx.fillStyle = "#ffffff";
    ctx.font = "700 " + Math.round(s * 0.56) + "px " + FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(letter, x, y + 1);
    ctx.restore();
  }

  function text(ctx, value, x, y, o) {
    o = o || {};
    ctx.save();
    if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
    ctx.font = (o.weight || 600) + " " + (o.size || 15) + "px " + FONT;
    ctx.textAlign = o.align || "center";
    ctx.textBaseline = o.baseline || "middle";
    if (o.pill) {
      var m = ctx.measureText(value), pad = 8, h = (o.size || 15) + 10;
      var left = o.align === "left" ? x - pad : o.align === "right" ? x - m.width - pad : x - m.width / 2 - pad;
      rounded(ctx, left, y - h / 2, m.width + 2 * pad, h, h / 2);
      ctx.fillStyle = o.pill;
      ctx.fill();
    }
    ctx.fillStyle = o.color || INK;
    ctx.fillText(value, x, y);
    ctx.restore();
  }

  function dots(ctx, x, y, count, alpha, vertical) {
    if (alpha <= 0.01) return;
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = HB;
    for (var k = 0; k < count; k++) {
      var off = (k - (count - 1) / 2) * 7;
      ctx.beginPath();
      ctx.arc(vertical ? x : x + off, vertical ? y + off : y, 2.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function blob(ctx, x, y, rx, ry, colour, alpha, label, labelDy) {
    if (alpha <= 0.01) return;
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = colour.replace("ALPHA", "0.16");
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = colour.replace("ALPHA", "0.9");
    ctx.stroke();
    if (label) text(ctx, label, x, y + (labelDy || 0), { size: 13, weight: 700, color: colour.replace("ALPHA", "1") });
    ctx.restore();
  }

  function polyline(ctx, points, colour, width, alpha) {
    if (points.length < 2 || alpha <= 0.01) return;
    ctx.save();
    if (alpha !== undefined) ctx.globalAlpha *= alpha;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (var i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.strokeStyle = colour;
    ctx.lineWidth = width || 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();
    ctx.restore();
  }

  function arrow(ctx, x1, y1, x2, y2, colour, alpha) {
    if (alpha <= 0.01) return;
    ctx.save();
    ctx.globalAlpha *= alpha === undefined ? 1 : alpha;
    var a = Math.atan2(y2 - y1, x2 - x1);
    ctx.strokeStyle = ctx.fillStyle = colour;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 11 * Math.cos(a - 0.42), y2 - 11 * Math.sin(a - 0.42));
    ctx.lineTo(x2 - 11 * Math.cos(a + 0.42), y2 - 11 * Math.sin(a + 0.42));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function legend(ctx, items, x, y) {
    items.forEach(function (item) {
      ctx.save();
      ctx.strokeStyle = item[0];
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 26, y); ctx.stroke();
      ctx.restore();
      text(ctx, item[1], x + 36, y, { size: 13, align: "left", color: SOFT, weight: 600 });
      x += 52 + item[1].length * 7.4;
    });
  }

  var HBONDS = { A: 2, T: 2, U: 2, G: 3, C: 3 };

  // ---- replication -------------------------------------------------------------------------------
  function drawReplication(ctx, s, d) {
    var n = d.top.length, dx = 40, x0 = 140, cy = 262, gap = 80, primer = d.primer, i, k;
    var apart = ease(s.apart);
    var swap = clamp(s.swap), ligate = clamp(s.ligate);
    function X(i) { return x0 + i * dx; }
    function open(i) { return ease((s.fork - i) / 3.2); }
    function yTop(i) { return cy - 24 - (gap + 34 * apart) * open(i); }
    function yBot(i) { return cy + 24 + (gap + 34 * apart) * open(i); }
    var busy = 1 - apart; // helper proteins fade when the copies separate

    // template strands (old)
    var topLine = [], botLine = [];
    for (i = 0; i < n; i++) { topLine.push([X(i), yTop(i) - 20]); botLine.push([X(i), yBot(i) + 20]); }
    polyline(ctx, topLine, OLD, 5);
    polyline(ctx, botLine, OLD, 5);
    for (i = 0; i < n; i++) {
      tile(ctx, X(i), yTop(i), d.top[i]);
      tile(ctx, X(i), yBot(i), d.bottom[i]);
      dots(ctx, X(i), cy, HBONDS[d.top[i]], 1 - clamp(open(i) * 5), true);
    }
    text(ctx, "5′", X(0) - 36, yTop(0), { size: 18, weight: 700, color: OLD });
    text(ctx, "3′", X(n - 1) + 36, yTop(n - 1), { size: 18, weight: 700, color: OLD });
    text(ctx, "3′", X(0) - 36, yBot(0), { size: 18, weight: 700, color: OLD });
    text(ctx, "5′", X(n - 1) + 36, yBot(n - 1), { size: 18, weight: 700, color: OLD });

    // a new nucleotide: RNA while it is a primer that has not been replaced yet
    function newTile(i, y, letter, isPrimer, amount, from) {
      var a = clamp(amount);
      if (a <= 0) return;
      var yy = y + from * 34 * (1 - ease(a));
      if (isPrimer && swap < 1) {
        tile(ctx, X(i), yy, letter === "T" ? "U" : letter, { rna: true, alpha: a * (1 - swap) });
        tile(ctx, X(i), yy, letter, { alpha: a * swap });
      } else {
        tile(ctx, X(i), yy, letter, { alpha: a });
      }
    }

    // leading strand: pairs with the bottom template, grows left to right (towards the fork)
    var lead = Math.min(s.lead, n), leadLine = [], primerLine = [];
    for (i = 0; i < n; i++) {
      var amount = lead - i;
      if (amount <= 0) break;
      var y = yBot(i) - 48;
      newTile(i, y, d.top[i], i < primer, amount, -1);
      dots(ctx, X(i), yBot(i) - 24, HBONDS[d.top[i]], clamp(amount), false);
      if (amount >= 0.5) { (i < primer ? primerLine : leadLine).push([X(i), y - 20]); if (i === primer - 1) leadLine.push([X(i) + dx / 2, y - 20]); }
    }
    if (primerLine.length) primerLine.push([primerLine[primerLine.length - 1][0] + (lead > primer ? dx / 2 : 0), primerLine[0][1]]);
    polyline(ctx, leadLine, NEW, 5);
    polyline(ctx, primerLine, swap >= 1 ? NEW : RNA, 5);
    if (lead > 0.5) {
      text(ctx, "5′", X(0) - 30, yBot(0) - 48, { size: 14, weight: 700, color: NEW });
      var tip = Math.min(Math.ceil(lead - 0.5), n) - 1;
      if (lead < n - 0.01 || apart > 0) text(ctx, "3′", X(tip) + 30, yBot(tip) - 48, { size: 14, weight: 700, color: NEW, alpha: lead >= n ? apart : 1 });
    }

    // lagging strand: pairs with the top template, each fragment grows right to left
    var joints = [];
    d.fragments.forEach(function (fragment, index) {
      var progress = s["f" + index] || 0, startI = fragment[0], endI = fragment[1], line = [], pline = [];
      for (var j = endI; j >= startI; j--) {
        var amount = progress - (endI - j);
        if (amount <= 0) break;
        var y = yTop(j) + 48, isPrimer = endI - j < primer;
        newTile(j, y, d.bottom[j], isPrimer, amount, 1);
        dots(ctx, X(j), yTop(j) + 24, HBONDS[d.bottom[j]], clamp(amount), false);
        if (amount >= 0.5) { (isPrimer ? pline : line).push([X(j), y + 20]); if (endI - j === primer - 1) line.push([X(j) - dx / 2, y + 20]); }
      }
      if (pline.length && progress > primer) pline.push([pline[pline.length - 1][0] - dx / 2, pline[0][1]]);
      polyline(ctx, line, NEW, 5);
      polyline(ctx, pline, swap >= 1 ? NEW : RNA, 5);
      if (progress > 0.5) {
        text(ctx, "5′", X(endI) + 11, yTop(endI) + 48 + 34, { size: 12, weight: 700, color: swap >= 1 ? NEW : RNA, alpha: 1 - ligate });
        if (progress >= endI - startI + 1 && index > 0) joints.push([X(startI) - dx / 2, yTop(startI) + 48 + 20, index]);
      }
      if (progress >= endI - startI + 0.9) {
        text(ctx, "Okazaki fragment " + (index + 1), X((startI + endI) / 2), yTop(startI) + 48 + 44, { size: 12.5, color: SOFT, alpha: (1 - ligate) * busy });
      }
      // polymerase or primase working on this fragment
      if (progress > 0 && progress < endI - startI + 1) {
        var at = X(endI - progress + 0.5), yy = yTop(Math.max(startI, Math.round(endI - progress))) + 48;
        if (progress <= primer) blob(ctx, at, yy, 26, 24, "rgba(242,156,203,ALPHA)", busy, "primase", 40);
        else blob(ctx, at, yy, 34, 28, "rgba(90,209,255,ALPHA)", busy, "DNA pol", 42);
      }
    });
    // nicks between fragments: ligase closes them
    joints.forEach(function (joint) {
      polyline(ctx, [[joint[0] - dx / 2, joint[1]], [joint[0] + dx / 2, joint[1]]], NEW, 5, ligate);
      if (s.ligate > 0 && ligate < 1) blob(ctx, joint[0], joint[1] + 2, 20, 16, "rgba(255,230,163,ALPHA)", busy * (swap >= 1 ? 1 : 0.4), "ligase", 30);
    });

    // proteins at the fork
    if (s.fork > 0.01 && s.fork < n + 1.5) {
      var xf = X(s.fork - 0.4), fade = clamp(s.fork) * clamp(n + 1.5 - s.fork) * busy;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.beginPath();
      for (k = 0; k < 6; k++) {
        var ang = (Math.PI / 3) * k + Math.PI / 6;
        ctx[k ? "lineTo" : "moveTo"](xf + 30 * Math.cos(ang), cy + 30 * Math.sin(ang));
      }
      ctx.closePath();
      ctx.fillStyle = "rgba(242,174,28,0.28)"; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = "#f2ae1c"; ctx.stroke();
      ctx.restore();
      text(ctx, "helicase", xf + 44, cy - 64, { size: 13.5, weight: 700, color: "#f2ae1c", alpha: fade, align: "left" });
      if (s.fork < n) arrow(ctx, xf + 112, cy - 64, xf + 160, cy - 64, "#f2ae1c", fade);
    }
    // single-strand binding proteins on template not yet copied
    for (i = 0; i < n; i++) {
      if (open(i) < 0.75) continue;
      var a = busy * clamp(open(i) * 4 - 3);
      var laggingCopied = d.fragments.some(function (fragment, index) {
        return i >= fragment[0] && i <= fragment[1] && (s["f" + index] || 0) - (fragment[1] - i) > 0.2;
      });
      ctx.save();
      ctx.fillStyle = "rgba(185,163,255,0.9)";
      if (!laggingCopied) { ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(X(i), yTop(i) + 30, 6, 0, 7); ctx.fill(); }
      if (lead - i <= 0.2) { ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(X(i), yBot(i) - 30, 6, 0, 7); ctx.fill(); }
      ctx.restore();
    }
    if (lead > primer && lead < n) blob(ctx, X(lead - 0.5), yBot(Math.max(0, Math.round(lead) - 1)) - 48, 34, 28, "rgba(90,209,255,ALPHA)", busy, "DNA pol", -42);
    else if (lead > 0 && lead <= primer && s.fork < n) blob(ctx, X(lead - 0.5), yBot(0) - 48, 26, 24, "rgba(242,156,203,ALPHA)", busy * clamp((primer + 0.01 - lead) * 50 + (s.f0 < primer ? 1 : 0)), "primase", -40);

    // captions inside the drawing
    var named = clamp(s.fork / 6) * busy;
    if (lead > primer) text(ctx, "leading strand: continuous, towards the fork", X(Math.min(lead, n) / 2), yBot(0) + 52, { size: 14, color: NEW, alpha: named, weight: 700 });
    if ((s.f0 || 0) > primer) text(ctx, "lagging strand: in fragments, away from the fork", X(Math.min(s.fork, n) / 2), yTop(0) - 46, { size: 14, color: NEW, alpha: named, weight: 700 });
    if (apart > 0) {
      text(ctx, "daughter helix 1: old strand + new strand", 600, yTop(0) - 46, { size: 16, weight: 700, alpha: apart });
      text(ctx, "daughter helix 2: old strand + new strand", 600, yBot(0) + 50, { size: 16, weight: 700, alpha: apart });
    }
    legend(ctx, [[OLD, "old (template) strand"], [NEW, "new DNA"], [RNA, "RNA primer"]], 40, 30);
    ctx.save(); ctx.fillStyle = "rgba(185,163,255,0.9)"; ctx.beginPath(); ctx.arc(668, 30, 6, 0, 7); ctx.fill(); ctx.restore();
    text(ctx, "single-strand binding protein", 682, 30, { size: 13, align: "left", color: SOFT });
  }

  // ---- transcription -----------------------------------------------------------------------------
  function drawTranscription(ctx, s, d) {
    var n = d.coding.length, dx = 34, x0 = 600 - ((n - 1) * dx) / 2, cy = 150, flank = d.flank, i, j;
    var total = d.rna.length, pos = Math.min(s.pos, total), hybrid = 5, lift = 120;
    var release = ease(s.release), compare = ease(s.compare);
    function X(i) { return x0 + i * dx; }
    var centre = flank + pos - 2;
    function bump(i) { return s.bubble * ease(1 - Math.abs(i - centre) / 5.2); }
    function yCoding(i) { return cy - 24 - 50 * bump(i); }
    var yTemplate = cy + 24;

    // gene arrow and promoter mark
    arrow(ctx, X(flank) - dx / 2, cy - 104, X(flank + total - 1) + dx / 2, cy - 104, SOFT, 1);
    text(ctx, "gene " + d.gene + " (first " + total + " letters): transcribed region", X(flank + (total - 1) / 2), cy - 122, { size: 13.5, color: SOFT });
    ctx.save();
    ctx.strokeStyle = "#f2ae1c"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(X(0) - dx / 2 - 4, cy - 86); ctx.lineTo(X(0) - dx / 2 - 4, cy - 104); ctx.lineTo(X(flank) - dx / 2 - 8, cy - 104); ctx.stroke();
    ctx.restore();
    text(ctx, "promoter", X(0) - dx / 2 - 6, cy - 122, { size: 13.5, color: "#f2ae1c", weight: 700, align: "left" });

    var codingLine = [], templateLine = [];
    for (i = 0; i < n; i++) { codingLine.push([X(i), yCoding(i) - 20]); templateLine.push([X(i), yTemplate + 20]); }
    polyline(ctx, codingLine, OLD, 5);
    polyline(ctx, templateLine, OLD, 5, 1 - 0.7 * compare);
    for (i = 0; i < n; i++) {
      var transcribed = i >= flank && i < flank + total;
      var ringed = compare > 0 && transcribed && d.coding[i] === "T";
      tile(ctx, X(i), yCoding(i), d.coding[i], { ring: ringed ? "rgba(255,255,255," + compare + ")" : null });
      tile(ctx, X(i), yTemplate, d.template[i], { alpha: 1 - 0.7 * compare });
      dots(ctx, X(i), (yCoding(i) + yTemplate) / 2, HBONDS[d.coding[i]], (1 - clamp(bump(i) * 4)) * (1 - 0.7 * compare), true);
    }
    text(ctx, "5′", X(0) - 34, cy - 24, { size: 17, weight: 700, color: OLD });
    text(ctx, "3′", X(n - 1) + 34, cy - 24, { size: 17, weight: 700, color: OLD });
    text(ctx, "3′", X(0) - 34, yTemplate, { size: 17, weight: 700, color: OLD, alpha: 1 - 0.7 * compare });
    text(ctx, "5′", X(n - 1) + 34, yTemplate, { size: 17, weight: 700, color: OLD, alpha: 1 - 0.7 * compare });
    text(ctx, "coding strand", X(n - 1) + 58, cy - 24, { size: 13.5, align: "left", color: SOFT });
    text(ctx, "template strand", X(n - 1) + 58, yTemplate, { size: 13.5, align: "left", color: SOFT, alpha: 1 - 0.7 * compare });

    // RNA polymerase
    if (s.enzyme > 0.01) {
      var px = X(centre + 0.5);
      ctx.save();
      ctx.globalAlpha = s.enzyme;
      rounded(ctx, px - 205, cy - 92, 410, 216, 96);
      ctx.fillStyle = "rgba(126,160,255,0.13)"; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "rgba(160,190,255,0.75)"; ctx.stroke();
      ctx.restore();
      text(ctx, "RNA polymerase", px, cy + 142, { size: 14, weight: 700, color: "#a9c1ff", alpha: s.enzyme });
      if (pos < total) arrow(ctx, px + 214, cy + 60, px + 262, cy + 60, "#a9c1ff", s.enzyme);
    }

    // the RNA: young nucleotides pair with the template, older ones trail away as a single strand
    var rowY = yTemplate + 150, line = [];
    for (j = 0; j < total; j++) {
      var amount = pos - j;
      if (amount <= 0) break;
      var a = clamp(amount), xi = X(flank + j), age = pos - 1 - j - (hybrid - 1);
      var x = xi, y = yTemplate + 48;
      if (age > 0) { x = X(flank + pos - hybrid) - age * dx * 0.86 + dx * 0.0; y = yTemplate + 48 + lift * ease(Math.min(age, 3.5) / 3.5); }
      if (age > 0 && age < 1) x = lerp(xi, x, ease(age));
      y += 30 * (1 - ease(a)); // arriving ribonucleotide
      var xr = lerp(x, xi, release), yr = lerp(y, rowY, release) - 62 * compare;
      var ring = compare > 0 && d.rna[j] === "U" ? "rgba(255,255,255," + compare + ")" : null;
      tile(ctx, xr, yr, d.rna[j], { rna: true, alpha: a, ring: ring });
      if (age <= 0 && release < 0.5) dots(ctx, xi, yTemplate + 24, HBONDS[d.rna[j]], a * (1 - release * 2), false);
      if (a >= 0.5) line.push([xr, yr + 20]);
      if (compare > 0.02) {
        ctx.save(); ctx.globalAlpha = compare * 0.55; ctx.strokeStyle = SOFT; ctx.setLineDash([3, 5]); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(xi, cy - 6); ctx.lineTo(xi, yr - 18); ctx.stroke(); ctx.restore();
      }
    }
    polyline(ctx, line, RNA, 5);
    if (line.length) {
      var first = line[0], last = line[line.length - 1];
      text(ctx, "5′", first[0] - 30 * (release > 0.5 ? 1 : 0.86), first[1] - 20, { size: 15, weight: 700, color: RNA });
      text(ctx, "3′", last[0] + 30, last[1] - 20, { size: 15, weight: 700, color: RNA, alpha: pos >= total ? release : 1 });
      text(ctx, release > 0.5 ? "messenger RNA (single strand)" : "new RNA", lerp(first[0], last[0], 0.5), Math.max(first[1], last[1]) + 26, { size: 13.5, color: RNA, weight: 700, alpha: clamp(pos / 4) });
    }
    if (compare > 0.02) text(ctx, "same letters as the coding strand, with U where DNA has T", 600, rowY + 34 - 62 * compare + 52, { size: 15, weight: 700, alpha: compare });
    legend(ctx, [[OLD, "DNA"], [RNA, "RNA"]], 40, H - 26);
  }

  // ---- translation -------------------------------------------------------------------------------
  function drawTranslation(ctx, s, d) {
    var codons = d.codons, nAmino = codons.length - 1, cw = 84, cx = 560, my = 392, i, k;
    var cycle = Math.min(s.cycle, nAmino - 1), kP = Math.floor(cycle + 1e-9), frac = cycle - kP;
    if (kP >= nAmino - 1) { kP = nAmino - 1; frac = 0; }
    var p = kP + ease((frac - 0.6) / 0.4);
    var arrive = ease(frac / 0.4), transfer = ease((frac - 0.4) / 0.2);
    var ribo = s.ribo, free = ease(s.free), rf = ease(s.rf);
    function CX(k) { return cx + (k - p) * cw; }

    // ribosome (behind everything)
    var small = clamp(ribo * 2), large = clamp(ribo * 2 - 1);
    if (small > 0.01) {
      ctx.save(); ctx.globalAlpha = small;
      ctx.beginPath(); ctx.ellipse(cx, my + 18, 226, 60, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(126,160,255,0.16)"; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "rgba(160,190,255,0.6)"; ctx.stroke(); ctx.restore();
      text(ctx, "small subunit", cx + 150, my + 64, { size: 13, color: "#a9c1ff", align: "left", alpha: small });
    }
    if (large > 0.01) {
      ctx.save(); ctx.globalAlpha = large;
      ctx.beginPath(); ctx.ellipse(cx, my - 150, 232, 138, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(126,160,255,0.11)"; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "rgba(160,190,255,0.6)"; ctx.stroke(); ctx.restore();
      text(ctx, "large subunit", cx + 250, my - 150, { size: 13, color: "#a9c1ff", align: "left", alpha: large });
      [["E", -1], ["P", 0], ["A", 1]].forEach(function (site) {
        text(ctx, site[0], cx + site[1] * cw, my + 62, { size: 17, weight: 700, color: "#a9c1ff", alpha: large });
      });
      text(ctx, "tRNA sites", cx - cw - 34, my + 62, { size: 12.5, color: SOFT, align: "right", alpha: large });
    }

    // mRNA tape
    var leftEdge = Math.max(30, CX(0) - cw / 2 - 150), rightEdge = Math.min(W - 30, CX(codons.length - 1) + cw / 2 + 60);
    polyline(ctx, [[leftEdge, my + 20], [rightEdge, my + 20]], RNA, 5);
    if (leftEdge < CX(0) - cw / 2 - 20) {
      text(ctx, "5′", leftEdge - 2, my - 2, { size: 16, weight: 700, color: RNA, align: "left" });
