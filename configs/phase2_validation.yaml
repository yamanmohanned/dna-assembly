# Phase 2: statistical validation of the sequencing simulator against theory.
# Everything that decides pass or fail, including every tolerance, is written here BEFORE the
# run. A check passes when the observed value is within z_max standard errors of the expected
# value, or follows the other rule stated next to the tolerance.
name: phase2_simulator_validation
seed: 20261022

genomes: [NC_001422.1, NC_001416.1]
genome_labels:
  NC_001422.1: phiX174
  NC_001416.1: lambda

read_length: 100          # fixed read length used for the coverage and error checks
coverages: [1, 2, 3, 5, 7, 10, 15, 20]
histogram_coverages: [5, 10, 20]   # must be a subset of coverages
replicates: 200           # independent simulated read sets per (genome, coverage)
min_overlap: 30           # theta: two reads are in the same true contig if they overlap >= theta
depth_bins: 50            # depth histogram covers depths 0..49

# Lander-Waterman exp(-c) is an approximation for a genome much longer than a read: test it there.
large_genome_check:
  genome_length: 1000000
  coverages: [1, 2, 5]
  replicates: 100

# Error model, checked on phiX174 reads
error_check:
  genome: NC_001422.1
  coverage: 10
  replicates: 100
substitution_rates: [0.001, 0.01, 0.05]
indel_scenario:
  substitution_rate: 0.01
  insertion_rate: 0.005
  deletion_rate: 0.005

# Read-length models (the fixed length is always checked as well) and start positions
length_check:
  genome_length: 1000000
  n_reads: 200000
length_models:
  - {name: uniform_80_120, kind: uniform, low: 80, high: 120}
  - {name: normal_100_15, kind: normal, mu: 100, sigma: 15, low: 50, high: 150}

tolerances:
  z_max: 4.0                  # |observed - expected| <= 4 standard errors
  histogram_z_max: 5.0        # per group of depth bins (many groups per panel, so a looser limit)
  histogram_min_positions: 100  # bins are merged until a group expects >= 100 positions per run
  contig_floor: 0.001         # absolute slack when the run-to-run spread of contigs is zero
  lw_large_genome_rel: 0.02   # exp(-c) check on a long genome: also allow 2% relative difference
  z_variance_range: [0.6, 1.4]  # per-run z-scores must have variance in this range
                                # (meaningful for about 100 runs; fewer runs spread more)
  chi2_alpha: 0.001           # goodness-of-fit and uniformity tests must give p >= alpha
