# Single source of truth for definitions. The report, the slides and the application read this
# file instead of retyping definitions (master prompt, Phase 6). Every entry has a plain-language
# explanation first ("plain", written for a 13-year-old) and then the precise definition.
# New terms are added in the phase where they first appear.
terms:
  - term: DNA
    phase: 1
    plain: >-
      The instruction book of a living thing, written as a very long chain of four kinds of
      building blocks.
    precise: >-
      A molecule made of two strands of nucleotides. Each nucleotide carries one of four bases:
      adenine (A), cytosine (C), guanine (G) or thymine (T).

  - term: base (nucleotide letter)
    phase: 1
    plain: One of the four letters, A, C, G or T, that spell out DNA.
    precise: >-
      A single symbol of the alphabet {A, C, G, T}. In this project a sequence is a string over
      this alphabet.

  - term: genome
    phase: 1
    plain: The complete text of the instruction book of one organism or virus.
    precise: >-
      The full DNA sequence of an organism or virus. Here, one string over {A, C, G, T} of
      length G, taken from an NCBI record.

  - term: NCBI
    phase: 1
    plain: A large public library in the United States that stores DNA sequences for scientists.
    precise: >-
      The National Center for Biotechnology Information. It hosts GenBank, RefSeq and the
      Entrez search and download system.

  - term: accession and version
    phase: 1
    plain: >-
      The catalogue number of a sequence in the library. The number after the dot says which
      edition it is, so the same number always gives the same letters.
    precise: >-
      An identifier such as NC_001422.1. The part before the dot names the record, the part
      after it is the version; a changed sequence gets a new version number.

  - term: RefSeq
    phase: 1
    plain: A shelf in the NCBI library with carefully checked reference copies.
    precise: >-
      NCBI's curated collection of reference sequences. Accessions starting with NC_ are
      RefSeq records of complete molecules.

  - term: Entrez
    phase: 1
    plain: The website service that lets a program ask the NCBI library for a sequence.
    precise: >-
      The NCBI search and retrieval system. Programs use its E-utilities (for example
      esummary and efetch) through Biopython's Bio.Entrez module.

  - term: FASTA
    phase: 1
    plain: >-
      A very simple text format for DNA: one line that starts with ">" and names the sequence,
      followed by lines of letters.
    precise: >-
      A text format with a header line beginning with ">" followed by one or more lines of
      sequence. Parsing rules used here are in genomeasm/io.py and docs/DATA_LOADING.md.

  - term: parser
    phase: 1
    plain: A small program that reads a file and checks that it follows the rules of its format.
    precise: >-
      A function that turns text into structured data and rejects text that violates the
      format. genomeasm.io.parse_fasta is the FASTA parser.

  - term: GC content
    phase: 1
    plain: Out of all the letters, the share that are G or C.
    precise: >-
      (number of G + number of C) / sequence length, a number between 0 and 1, usually shown
      as a percentage.

  - term: ambiguity code (IUPAC)
    phase: 1
    plain: >-
      A letter that means "not sure which one", for example N for "any of the four". Real data
      sometimes contains it where the machine could not decide.
    precise: >-
      An IUPAC nucleotide symbol other than A, C, G, T: R, Y, S, W, K, M, B, D, H, V or N.
      This project rejects genomes that contain any (decision D-016) rather than guessing.

  - term: checksum (SHA-256)
    phase: 1
    plain: >-
      A fingerprint of a file. If even one letter changes, the fingerprint changes completely,
      so we can tell that a file is untouched.
    precise: >-
      The 256-bit output of the SHA-256 hash function, written as 64 hexadecimal digits. The
      same bytes always give the same value.

  - term: cache
    phase: 1
    plain: >-
      A saved copy kept close by, so we do not have to download it again and can work without
      internet.
    precise: >-
      Here, the folder data/raw/ holding the FASTA file, its NCBI metadata and SHA256SUMS for
      each genome. Loading reads only the cache unless a download is explicitly requested.

  - term: data card
    phase: 1
    plain: A one-page fact sheet about a data set, like the label on a food package.
    precise: >-
      A JSON and Markdown summary generated from the cached files: accession, version,
      organism, length, base counts, GC content and checksums.

  - term: read
    phase: 2
    plain: >-
      A short piece of DNA text that the sequencing machine reads in one go, like one strip torn
      from a very long roll of paper.
    precise: >-
      A string over {A, C, G, T} obtained from one position of the genome, possibly with errors.
      Here the typical length is l = 100.

  - term: coverage and depth
    phase: 2
    plain: >-
      How many layers of strips lie on top of each spot of the long paper, on average.
    precise: >-
      With N reads of length l from a genome of length G, the nominal coverage is c = N * l / G.
      The depth at a position is the number of reads that cover it; its average over the genome
      is exactly c when every read lies inside the genome.

  - term: uncovered fraction
    phase: 2
    plain: The share of spots on the long paper that no strip happened to cover.
    precise: >-
      The fraction of genome positions with depth 0. Lander-Waterman predicts exp(-c); the exact
      finite-genome model of this project also accounts for the genome ends.

  - term: Poisson distribution
    phase: 2
    plain: >-
      The pattern of counts you get when things land at random, like how many raindrops hit each
      paving stone.
    precise: >-
      P(k) = exp(-c) * c^k / k! for k = 0, 1, 2, ... Lander-Waterman approximates the depth at a
      position by a Poisson distribution with mean c.

  - term: Lander-Waterman model
    phase: 2
    plain: >-
      A classic piece of mathematics that predicts how many spots stay bare, and how many
      separate pieces appear, when random strips are thrown onto a long paper.
    precise: >-
      Reads start at uniformly random positions. It predicts depth ~ Poisson(c), uncovered
      fraction ~ exp(-c) and about N * exp(-c * (1 - theta / l)) contigs, ignoring the genome
      ends. Original source: Lander and Waterman (1988); the citation is TODO-VERIFY until it is
      checked.

  - term: edge effect
    phase: 2
    plain: >-
      Near the two ends of the genome fewer strips can cover a spot, because every strip has to
      fit inside the genome.
    precise: >-
      For a position x closer than l - 1 to an end, the probability q(x) that a random read
      covers it is smaller than l / (G - l + 1), so uncovered positions are more likely than
      exp(-c) says.

  - term: contig
    phase: 2
    plain: >-
      A stretch of the genome that the reads cover without a gap, so it can be put together in
      one piece.
    precise: >-
      A true contig is a maximal group of reads chained by true overlaps of at least theta
      bases, counted from the known read positions. An assembler's contigs are judged against
      these.

  - term: ground truth
    phase: 2
    plain: >-
      The answer key. Because we made the reads ourselves, we know exactly where each one came
      from and which mistakes were put in.
    precise: >-
      For every simulated read, its true start position, the number of reference bases it
      covers and its counts of substitutions, insertions and deletions.

  - term: substitution error
    phase: 2
    plain: A typing mistake where one letter is swapped for a different letter.
    precise: >-
      A kept base replaced by one of the three other bases, each with probability 1/3. The
      substitution rate is the probability of this for each kept base.

  - term: indel (insertion and deletion)
    phase: 2
    plain: >-
      A typing mistake where a letter is skipped (deletion) or an extra letter slips in
      (insertion).
    precise: >-
      Deletion: a reference base is dropped with probability p_del. Insertion: after each
      reference base, one random base is inserted with probability p_ins.

  - term: random seed
    phase: 2
    plain: >-
      A starting number that makes a computer's dice rolls repeat exactly, so a random
      experiment can be run again and give identical results.
    precise: >-
      An integer given to numpy's SeedSequence. The same seed and configuration always give the
      same output; independent streams are spawned from it for read positions and for errors.

  - term: Monte Carlo simulation
    phase: 2
    plain: >-
      Finding out how something behaves by running it many times with random dice and looking at
      all the results.
    precise: >-
      Estimating an expected value by averaging over R independent random runs. The uncertainty
      of the average is its standard error.

  - term: standard error
    phase: 2
    plain: >-
      How much an average would wobble if the whole experiment were repeated. Smaller means more
      trust in the average.
    precise: >-
      The sample standard deviation across R independent runs divided by the square root of R.
      Checks in this project pass when the observed value is within a stated number of standard
      errors of the expected value.

  - term: provenance
    phase: 2
    plain: The label on a result that says exactly how and when it was made.
    precise: >-
      The record stored with every result: configuration hash, git commit and whether the code
      was modified, random seed, library versions, machine information and a timestamp.
