[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genomeasm"
version = "0.1.0"
description = "DNA fragment assembly as an asymmetric TSP, with a learning-based ALNS"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "numba",
    "pandas",
    "scipy",
    "biopython",
    "pyyaml",
    "matplotlib",
    "plotly",
]

[project.optional-dependencies]
app = ["streamlit", "kaleido"]
report = ["python-pptx"]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy"]

[project.scripts]
genomeasm = "genomeasm.cli:main"

[tool.setuptools.packages.find]
include = ["genomeasm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: long-running statistical or benchmark tests (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

# numba kernels draw random numbers from numba's own generator (np.random.* inside @njit) by design
[tool.ruff.lint.per-file-ignores]
"genomeasm/solvers/tabu.py" = ["NPY002"]
"genomeasm/solvers/alns.py" = ["NPY002"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
