# Tool configuration only. The package metadata ([project]) is added in Phase 1, when genomeasm gets code.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: long-running statistical or benchmark tests (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
